# Company boards are optional. Leave `sites` empty to search only the shared boards:
# YC Work at a Startup, public Ashby, Greenhouse, and Lever listings, and the other
# job boards selected from the CV. LinkedIn does not publish employee posts for this.

schedule_minutes: 30

email:
  to: you@example.com
  subject_prefix: "[Jobs]"

# Empty lists match every opening. Keywords are matched against the title and team.
# Locations are matched against the location text.
filters:
  keywords: []
  locations: []

sites:
  - name: Example Greenhouse
    url: https://boards.greenhouse.io/example
    # keywords: ["engineer", "python"]
    # locations: ["remote"]

